# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: JDY's Blog
subtitle: ''
description: ''
keywords:
author: 爱喝可乐的北极熊
language: zh-CN
timezone: ''

# URL
## Set your site url here. For example, if you use GitHub Page, set url as 'https://username.github.io/project'
url: http://example.com
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true # Set to false to remove trailing 'index.html' from permalinks
  trailing_html: true # Set to false to remove trailing '.html' from permalinks

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link:
  enable: true # Open external links in new tab
  field: site # Apply to the whole site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page setting
# path: Root path for your blogs index page. (default = '')
# per_page: Posts displayed per page. (0 = disable pagination)
# order_by: Posts order. (Order by date descending by default)
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
## https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta
meta_generator: true

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss
## updated_option supports 'mtime', 'date', 'empty'
updated_option: 'mtime'

# Pagination
## Set per_page to 0 to disable pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
## include:/exclude: options only apply to the 'source/' folder
include:
exclude:
ignore:

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: butterfly

# Deployment
## Docs: https://hexo.io/docs/one-command-deployment
deploy:
  type: git
  # 下面的 IP 换成你服务器的公网 IP
  # 如果你是 root 用户，用 root@IP；如果是 jdy 用户，用 jdy@IP
  repo: root@8.141.86.241:/root/hexo.git
  branch: master

# --------------------------------------
# Butterfly Theme Configuration
# --------------------------------------

# Custom CSS and JS
inject:
  head:
    - <link rel="stylesheet" href="/css/custom.css">

# Image Settings
favicon: /img/favicon.png

avatar:
  img: /img/touxiang.jpg
  effect: false

# Disable all banner images
disable_top_img: false

# The banner image of index page
index_img: /img/top-banner.jpg

cover:
  index_enable: true
  aside_enable: true
  archives_enable: true
  default_cover: false

# --------------------------------------
# Gallery Plugin Configuration (hexo-gallery)
# --------------------------------------
gallery:
  enable: true
  lazyload: true           # 启用懒加载
  columns: 3               # 列数（桌面端）
  gap: 15                  # 图片间距（像素）
  thumbnail_size: 400      # 缩略图尺寸
  lightbox: true           # 启用灯箱效果（点击放大）
  caption: true            # 显示图片标题
  
# Mobile responsive settings
  mobile_columns: 2        # 移动端列数
  tablet_columns: 3        # 平板端列数

# --------------------------------------
# APlayer Music Player Configuration (hexo-tag-aplayer)
# --------------------------------------
aplayer:
  meting: true             # 启用 MetingJS 支持（网易云音乐等）
  asset_inject: true       # 自动注入 CSS/JS 资源
  fixed: false             # 固定底部播放器（false=不固定）
  mini: false              # 迷你模式
  autoplay: false          # 自动播放
  theme: '#ad7a86'         # 主题颜色
  volume: 0.7              # 默认音量（0-1）
  mutex: true              # 互斥模式（同时只播放一个）
  lrcType: 3               # 歌词类型（0=无，1=内联，3=外部文件）
  
# Meting API configuration
  meting_api: 'https://api.i-meto.com/meting/api?server=:server&type=:type&id=:id&r=:r'

# Live2D
## https://github.com/EYHN/hexo-helper-live2d
live2d:
  enable: true #开关插件版看板娘
  scriptFrom: local # 默认
  pluginRootPath: live2dw/ # 插件在站点上的根目录(相对路径)
  pluginJsPath: lib/ # 脚本文件相对与插件根目录路径
  pluginModelPath: assets/ # 模型文件相对与插件根目录路径
  # scriptFrom: jsdelivr # jsdelivr CDN
  # scriptFrom: unpkg # unpkg CDN
  # scriptFrom: https://npm.elemecdn.com/live2d-widget@3.x/lib/L2Dwidget.min.js # 你的自定义 url
  tagMode: false # 标签模式, 是否仅替换 live2d tag标签而非插入到所有页面中
  debug: false # 调试, 是否在控制台输出日志
  model:
    use: live2d-widget-model-koharu # npm-module package name
    # use: wanko # 博客根目录/live2d_models/ 下的目录名
    # use: ./wives/wanko # 相对于博客根目录的路径
    # use: https://npm.elemecdn.com/live2d-widget-model-wanko@1.0.5/assets/wanko.model.json # 你的自定义 url
  display:
    position: right #控制看板娘位置
    width: 150 #控制看板娘大小
    height: 300 #控制看板娘大小
  mobile:
    show: true # 手机中是否展示