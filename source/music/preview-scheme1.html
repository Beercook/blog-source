<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>方案一：沉浸式唱片风格</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .music-container {
            width: 90%;
            max-width: 600px;
            text-align: center;
            color: white;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }

        .subtitle {
            font-size: 1.1em;
            opacity: 0.9;
            margin-bottom: 40px;
        }

        .vinyl-player {
            position: relative;
            width: 350px;
            height: 350px;
            margin: 0 auto 40px;
        }

        .vinyl-disc {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: 
                radial-gradient(circle at center, #000 0%, #000 15%, transparent 15%),
                repeating-radial-gradient(circle at center, #1a1a1a 0px, #1a1a1a 2px, #2d2d2d 2px, #2d2d2d 4px);
            box-shadow: 
                0 0 50px rgba(0,0,0,0.5),
                inset 0 0 30px rgba(255,255,255,0.1);
            animation: rotate 10s linear infinite;
            animation-play-state: paused;
            position: relative;
        }

        .vinyl-disc.playing {
            animation-play-state: running;
        }

        .vinyl-cover {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect fill="%23ff6b6b" width="100" height="100"/><text x="50" y="55" text-anchor="middle" fill="white" font-size="12">封面</text></svg>');
            background-size: cover;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .song-info {
            margin-bottom: 30px;
        }

        .song-title {
            font-size: 1.8em;
            margin-bottom: 10px;
        }

        .song-artist {
            font-size: 1.2em;
            opacity: 0.8;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .control-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            border: 2px solid rgba(255,255,255,0.5);
            color: white;
            font-size: 1.5em;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .control-btn:hover {
            background: rgba(255,255,255,0.3);
            transform: scale(1.1);
        }

        .control-btn.play {
            width: 70px;
            height: 70px;
            font-size: 2em;
            background: rgba(255,255,255,0.3);
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255,255,255,0.2);
            border-radius: 3px;
            margin-bottom: 20px;
            cursor: pointer;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            width: 30%;
            background: white;
            border-radius: 3px;
            transition: width 0.1s;
        }

        .time-display {
            display: flex;
            justify-content: space-between;
            font-size: 0.9em;
            opacity: 0.8;
            margin-bottom: 30px;
        }

        .lyrics-container {
            margin-top: 30px;
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 20px;
            backdrop-filter: blur(10px);
            max-height: 300px;
            overflow-y: auto;
        }

        .lyrics-container h3 {
            margin-bottom: 15px;
            font-size: 1.2em;
            text-align: center;
        }

        .lyrics-text {
            text-align: center;
            line-height: 2;
            font-size: 1em;
        }

        .lyric-line {
            padding: 8px 0;
            opacity: 0.5;
            transition: all 0.3s ease;
        }

        .lyric-line.active {
            opacity: 1;
            font-size: 1.2em;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
        }

        .lyrics-container::-webkit-scrollbar {
            width: 6px;
        }

        .lyrics-container::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
        }

        .lyrics-container::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.3);
            border-radius: 3px;
        }

        .playlist {
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 20px;
            backdrop-filter: blur(10px);
            margin-top: 20px;
        }

        .playlist h3 {
            margin-bottom: 15px;
            font-size: 1.3em;
        }

        .playlist-item {
            padding: 12px;
            margin-bottom: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .playlist-item:hover {
            background: rgba(255,255,255,0.2);
            transform: translateX(5px);
        }

        .playlist-item.active {
            background: rgba(255,255,255,0.3);
            border-left: 4px solid white;
        }

        .playlist-item img {
            width: 50px;
            height: 50px;
            border-radius: 5px;
            object-fit: cover;
        }

        .playlist-item-info {
            flex: 1;
            text-align: left;
        }

        .playlist-item-title {
            font-weight: bold;
            margin-bottom: 3px;
        }

        .playlist-item-artist {
            font-size: 0.9em;
            opacity: 0.8;
        }

        .note {
            margin-top: 30px;
            padding: 15px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            font-size: 0.9em;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="music-container">
        <h1>🎵 我的私人曲库</h1>
        <p class="subtitle">沉浸式唱片播放体验</p>

        <div class="vinyl-player">
            <div class="vinyl-disc" id="vinylDisc">
                <div class="vinyl-cover"></div>
            </div>
        </div>

        <div class="song-info">
            <div class="song-title">金斧子银斧子</div>
            <div class="song-artist">薛之谦</div>
        </div>

        <div class="progress-bar" onclick="seek(event)">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <div class="time-display">
            <span id="currentTime">1:23</span>
            <span id="totalTime">4:15</span>
        </div>

        <div class="controls">
            <button class="control-btn" onclick="prevSong()">⏮</button>
            <button class="control-btn play" id="playBtn" onclick="togglePlay()">▶</button>
            <button class="control-btn" onclick="nextSong()">⏭</button>
        </div>

        <div class="lyrics-container">
            <h3>📝 歌词</h3>
            <div class="lyrics-text" id="lyricsText">
                <div class="lyric-line active">王位 - 杨和苏KeyNG</div>
                <div class="lyric-line">词：杨和苏KeyNG</div>
                <div class="lyric-line">曲：杨和苏KeyNG</div>
                <div class="lyric-line">编曲：Mai "No Label Crew"/Mark Goble Music</div>
                <div class="lyric-line">...</div>
                <div class="lyric-line">（播放时歌词会同步滚动）</div>
            </div>
        </div>

        <div class="playlist">
            <h3>📋 播放列表</h3>
            <div class="playlist-item active">
                <img src="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 50 50'><rect fill='%23ff6b6b' width='50' height='50'/><text x='25' y='30' text-anchor='middle' fill='white' font-size='8'>封面</text></svg>" alt="cover">
                <div class="playlist-item-info">
                    <div class="playlist-item-title">金斧子银斧子</div>
                    <div class="playlist-item-artist">薛之谦</div>
                </div>
            </div>
            <div class="playlist-item">
                <img src="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 50 50'><rect fill='%234ecdc4' width='50' height='50'/><text x='25' y='30' text-anchor='middle' fill='white' font-size='8'>封面</text></svg>" alt="cover">
                <div class="playlist-item-info">
                    <div class="playlist-item-title">于是</div>
                    <div class="playlist-item-artist">邓紫棋</div>
                </div>
            </div>
            <div class="playlist-item">
                <img src="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 50 50'><rect fill='%23ffe66d' width='50' height='50'/><text x='25' y='30' text-anchor='middle' fill='white' font-size='8'>封面</text></svg>" alt="cover">
                <div class="playlist-item-info">
                    <div class="playlist-item-title">王位</div>
                    <div class="playlist-item-artist">杨和苏</div>
                </div>
            </div>
        </div>

        <div class="note">
            <strong>💡 特点说明：</strong><br>
            • 旋转唱片动画，播放时自动旋转<br>
            • 渐变背景 + 毛玻璃效果<br>
            • 简洁的播放控制界面<br>
            • 底部歌曲列表快速切换
        </div>
    </div>

    <script>
        let isPlaying = false;
        const vinylDisc = document.getElementById('vinylDisc');
        const playBtn = document.getElementById('playBtn');
        const progressFill = document.getElementById('progressFill');

        function togglePlay() {
            isPlaying = !isPlaying;
            if (isPlaying) {
                vinylDisc.classList.add('playing');
                playBtn.textContent = '⏸';
            } else {
                vinylDisc.classList.remove('playing');
                playBtn.textContent = '▶';
            }
        }

        function prevSong() {
            console.log('上一首');
        }

        function nextSong() {
            console.log('下一首');
        }

        function seek(event) {
            const progressBar = event.currentTarget;
            const clickX = event.offsetX;
            const width = progressBar.offsetWidth;
            const percent = (clickX / width) * 100;
            progressFill.style.width = percent + '%';
        }

        // 模拟进度条更新
        setInterval(() => {
            if (isPlaying) {
                const currentWidth = parseFloat(progressFill.style.width) || 30;
                if (currentWidth < 100) {
                    progressFill.style.width = (currentWidth + 0.5) + '%';
                }
            }
        }, 1000);
    </script>
</body>
</html>
